<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cevicheria El Buen Sabor - Sistema de Gestión</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Tu CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

    <!-- ================= LOGIN ================= -->
    <div class="login-wrapper" id="loginSection">
        <div class="login-box shadow-lg">
            <div class="text-center mb-4">
                <div class="logo-circle mb-3">
                    <i class="bi bi-tsunami"></i> 
                </div>
                <h2 class="fw-bold text-primary">El Buen Sabor</h2>
                <p class="text-muted">Gestión de Cevicheria</p>
            </div>
            
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label text-muted">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" placeholder="Ej: admin" value="admin" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-key"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="••••••" value="123" required>
                    </div>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">Ingresar</button>
                </div>
                <div id="loginError" class="alert alert-danger mt-3 d-none text-center" role="alert">
                    Usuario o contraseña incorrectos
                </div>
            </form>
            <div class="text-center mt-3">
                <small class="text-muted">Usuarios: admin/123</small>
            </div>
        </div>
    </div>

    <!-- ================= DASHBOARD ================= -->
    <div id="appContainer" class="d-none">
        <div class="d-flex" id="wrapper">
            <!-- Sidebar -->
            <div class="bg-white border-end" id="sidebar-wrapper">
                <div class="sidebar-heading text-center py-4 text-primary fs-4 fw-bold border-bottom">
                    <i class="bi bi-tsunami me-2"></i>El Buen Sabor
                </div>
                
                <div class="text-center py-3 border-bottom bg-light">
                    <div class="mb-2"><i class="bi bi-person-circle fs-3 text-secondary"></i></div>
                    <h6 class="m-0" id="sidebarUserName">Usuario</h6>
                    <small class="text-muted" id="sidebarUserRole">Rol</small>
                </div>

                <div class="list-group list-group-flush my-3">
                    <button class="list-group-item list-group-item-action bg-transparent border-0" onclick="mostrarPagina('inicio')">
                        <i class="bi bi-grid me-2"></i>Dashboard
                    </button>
                    <!-- NUEVOS BOTONES SEGÚN PROTOTIPOS -->
                    <button class="list-group-item list-group-item-action bg-transparent border-0" onclick="mostrarPagina('pos')">
                        <i class="bi bi-cart-plus me-2"></i>Registrar Venta
                    </button>
                    <button class="list-group-item list-group-item-action bg-transparent border-0" onclick="mostrarPagina('inventario')">
                        <i class="bi bi-box-seam me-2"></i>Gestión Inventario
                    </button>
                    <button class="list-group-item list-group-item-action bg-transparent border-0" onclick="mostrarPagina('insumos')">
                        <i class="bi bi-truck me-2"></i>Recepción Insumos
                    </button>
                    <button class="list-group-item list-group-item-action bg-transparent border-0" onclick="mostrarPagina('reportes')">
                        <i class="bi bi-bar-chart-line me-2"></i>Reportes
                    </button>
                    
                    <div class="border-top my-3"></div>
                    
                    <button class="list-group-item list-group-item-action bg-transparent border-0 text-danger" onclick="cerrarSesion()">
                        <i class="bi bi-box-arrow-left me-2"></i>Cerrar Sesión
                    </button>
                </div>
            </div>

            <!-- Contenido Principal -->
            <div id="page-content-wrapper" class="w-100">
                <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4 py-3">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-list fs-3 me-3 cursor-pointer" id="menu-toggle"></i>
                        <h4 class="m-0 text-primary fw-bold" id="pageTitle">Dashboard</h4>
                    </div>
                    
                    <div class="ms-auto d-flex align-items-center">
                        <span class="me-3 text-muted d-none d-md-block" id="fecha-actual"></span>
                        <div class="position-relative me-3">
                            <i class="bi bi-bell fs-5"></i>
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="notif-count">3</span>
                        </div>
                    </div>
                </nav>

                <div class="container-fluid px-4 py-4">
                    <!-- CONTENIDO DINÁMICO (Aquí se cargan las pantallas) -->
                    <div id="contenido-principal"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
